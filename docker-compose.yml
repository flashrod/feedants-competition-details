version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - feedants-mongo:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/feedants
      CORS_ORIGIN: "*"
    depends_on:
      - mongo

volumes:
  feedants-mongo:
